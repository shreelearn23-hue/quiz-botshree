<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreelearn - TCS/IBPS Exam Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .tcs-polygon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col h-screen select-none overflow-hidden font-sans">

    <!-- Top TCS Header -->
    <header class="bg-slate-900 text-white px-4 py-2 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="bg-indigo-600 text-xs px-2 py-1 rounded font-bold uppercase tracking-wider">श्री CBT</span>
            <h1 class="text-sm font-bold truncate max-w-[200px] sm:max-w-md" id="header-test-title">Shreelearn Mock Test</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-slate-800 px-3 py-1 rounded border border-slate-700 flex items-center gap-2">
                <i class="fa-regular fa-clock text-amber-400"></i>
                <span class="text-xs text-slate-300">उरलेला वेळ:</span>
                <span id="timer" class="font-mono font-bold text-amber-300 text-sm">90:00</span>
            </div>
            <div class="hidden sm:flex items-center gap-2 bg-slate-800 px-2 py-1 rounded">
                <i class="fa-solid fa-user-graduate text-slate-400"></i>
                <span class="text-xs text-slate-200">उमेदवार</span>
            </div>
        </div>
    </header>

    <!-- Quiz Selector Bar -->
    <div class="bg-slate-800 text-white px-4 py-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 text-xs">
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <span class="text-slate-300 font-semibold"><i class="fa-solid fa-folder-open text-indigo-400"></i> परीक्षा निवडा:</span>
            <select id="quiz-dropdown" onchange="changeQuizFile(this.value)" class="bg-slate-900 text-amber-300 border border-slate-600 px-2 py-1 rounded flex-1 sm:w-64 focus:outline-none">
                <option value="">चाचण्या शोधत आहे...</option>
            </select>
        </div>
        <!-- Subject Tabs -->
        <div id="subject-tabs-container" class="flex gap-1 overflow-x-auto py-1"></div>
    </div>

    <!-- Main Exam Body -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Question Screen (Left) -->
        <section class="flex-1 flex flex-col bg-white border-r border-gray-300 overflow-hidden">
            <!-- Question Meta -->
            <div class="px-4 py-2 border-b border-gray-200 bg-gray-50 flex justify-between items-center text-xs text-gray-600 font-semibold">
                <span id="current-q-label">प्रश्न क्र. 1</span>
                <span>गुण: <span class="text-green-600">+2.00</span> | <span class="text-red-500">-0.50</span></span>
            </div>

            <!-- Question & Options Area -->
            <div class="flex-1 p-4 md:p-6 overflow-y-auto">
                <p id="question-text" class="text-sm md:text-base font-medium text-gray-900 mb-6 leading-relaxed">
                    प्रश्न लोड होत आहे, कृपया थांबा...
                </p>

                <div id="options-container" class="space-y-3"></div>
            </div>

            <!-- Bottom Actions -->
            <footer class="p-3 bg-gray-50 border-t border-gray-300 flex flex-wrap justify-between items-center gap-2">
                <div class="flex gap-2">
                    <button onclick="markForReview()" class="px-3 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-800 border border-purple-300 rounded text-xs font-semibold">
                        रिव्ह्यूसाठी ठेवा
                    </button>
                    <button onclick="clearResponse()" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-xs font-semibold">
                        उत्तर हटवा
                    </button>
                </div>
                <div class="flex gap-2">
                    <button onclick="prevQuestion()" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-xs font-semibold">
                        मागे
                    </button>
                    <button onclick="saveAndNext()" class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded text-xs font-semibold shadow">
                        सेव्ह करून पुढे जा
                    </button>
                </div>
            </footer>
        </section>

        <!-- Question Palette (Right Panel) -->
        <aside class="w-full md:w-80 bg-gray-50 flex flex-col border-t md:border-t-0 border-gray-300">
            <!-- Legend Indicators -->
            <div class="p-3 border-b border-gray-200 grid grid-cols-2 gap-2 text-[11px] text-gray-600">
                <div class="flex items-center gap-1.5"><span class="w-4 h-4 rounded-full bg-green-600 text-white inline-flex items-center justify-center text-[9px] font-bold" id="count-ans">0</span> उत्तरे दिलेले</div>
                <div class="flex items-center gap-1.5"><span class="w-4 h-4 rounded-full bg-red-500 text-white inline-flex items-center justify-center text-[9px] font-bold" id="count-unans">0</span> उत्तरे न दिलेले</div>
                <div class="flex items-center gap-1.5"><span class="w-4 h-4 rounded-full bg-purple-600 text-white inline-flex items-center justify-center text-[9px] font-bold" id="count-review">0</span> रिव्ह्यूसाठी</div>
                <div class="flex items-center gap-1.5"><span class="w-4 h-4 rounded-full bg-gray-200 text-gray-700 border inline-flex items-center justify-center text-[9px] font-bold" id="count-notvisit">0</span> न पाहिलेले</div>
            </div>

            <!-- Palette Numbers -->
            <div class="flex-1 p-3 overflow-y-auto">
                <h4 class="text-xs font-bold text-gray-700 mb-2">प्रश्न पॅलेट:</h4>
                <div id="palette-grid" class="grid grid-cols-5 gap-2"></div>
            </div>

            <!-- Submit Test -->
            <div class="p-3 border-t border-gray-200 bg-white">
                <button onclick="submitTest()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded text-xs shadow tracking-wide">
                    परीक्षा सबमिट करा (SUBMIT)
                </button>
            </div>
        </aside>
    </main>

    <!-- Post-Exam Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 text-center space-y-4">
            <h3 class="text-xl font-bold text-gray-800">परीक्षेचा निकाल 📊</h3>
            <div class="grid grid-cols-3 gap-2 py-3 bg-gray-50 rounded-lg text-xs">
                <div><div class="font-bold text-gray-500">एकूण प्रश्न</div><div id="res-total" class="text-base font-bold text-gray-800">0</div></div>
                <div><div class="font-bold text-green-600">बरोबर</div><div id="res-correct" class="text-base font-bold text-green-600">0</div></div>
                <div><div class="font-bold text-red-500">चूक</div><div id="res-wrong" class="text-base font-bold text-red-500">0</div></div>
            </div>
            <div class="text-2xl font-black text-indigo-600" id="res-score">गुण: 0 / 0</div>
            <div class="flex gap-2">
                <button onclick="location.reload()" class="flex-1 py-2 bg-indigo-600 text-white rounded font-semibold text-xs">पुन्हा सोडवा</button>
                <a href="/" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded font-semibold text-xs flex items-center justify-center">मुख्य पानावर जा</a>
            </div>
        </div>
    </div>

    <!-- Logic Engine -->
    <script>
        let questions = [];
        let currentIndex = 0;
        let userResponses = {}; // { index: { selected: null, status: 'visited'/'answered'/'review' } }
        let timerSeconds = 90 * 60;
        let timerInterval = null;

        // Auto Load Quizzes list from GitHub repo
        async function fetchAvailableQuizzes() {
            const dropdown = document.getElementById('quiz-dropdown');
            try {
                const res = await fetch('/api/list-quizzes');
                const result = await res.json();
                const files = result.files || [];

                dropdown.innerHTML = '';
                if (files.length === 0) {
                    dropdown.innerHTML = '<option value="">कोणतीही चाचणी सापडली नाही</option>';
                    return;
                }

                // Folders ke according grouping
                const groups = {};
                files.forEach(item => {
                    if (!groups[item.folder]) groups[item.folder] = [];
                    groups[item.folder].push(item);
                });

                Object.keys(groups).forEach(folder => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = `📁 ${folder.replace('_', ' ')}`;
                    
                    groups[folder].forEach(q => {
                        const opt = document.createElement('option');
                        opt.value = q.path;
                        
                        // NEW Badge + FREE/PAID Badge
                        const newBadge = q.is_new ? '🔥 [NEW] ' : '';
                        const accessBadge = q.is_paid ? '🔒 [PAID] ' : '🟢 [FREE] ';
                        
                        opt.textContent = `${newBadge}${accessBadge}${q.title}`;
                        optgroup.appendChild(opt);
                    });
                    dropdown.appendChild(optgroup);
                });

                // Pehla test auto load karein
                loadQuizData(files[0].path);

            } catch (err) {
                console.error("List fetch error:", err);
            }
        }
        async function loadQuizData(path) {
            try {
                const res = await fetch(`/api/get-quiz?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                parseQuestions(data);
            } catch (err) {
                alert("चाचणी लोड करताना अडचण आली. कृपया पुन्हा प्रयत्न करा.");
            }
        }

        function changeQuizFile(val) {
            if (val) loadQuizData(val);
        }

        // Adapter to handle Quiz-bot JSON format
        function parseQuestions(raw) {
            questions = [];
            let qId = 1;

            if (raw.categories && Array.isArray(raw.categories)) {
                raw.categories.forEach(cat => {
                    const subject = cat.display_name || "सामान्य";
                    (cat.quizzes || []).forEach(q => {
                        questions.push({
                            id: qId++,
                            subject: subject,
                            question: q.question || q.q,
                            options: q.options || q.choices || [],
                            answer: (q.correct_option_id !== undefined) ? q.correct_option_id : (q.answer !== undefined ? q.answer : 0),
                            explanation: q.explanation || ""
                        });
                    });
                });
            } else if (Array.isArray(raw)) {
                raw.forEach(q => {
                    questions.push({
                        id: qId++,
                        subject: q.subject || q.category || "सामान्य",
                        question: q.question || q.q,
                        options: q.options || q.choices || [],
                        answer: (q.correct_option_id !== undefined) ? q.correct_option_id : 0,
                        explanation: q.explanation || ""
                    });
                });
            }

            if (questions.length === 0) {
                document.getElementById('question-text').textContent = "या फाईलमध्ये कोणतेही प्रश्न आढळले नाहीत.";
                return;
            }

            // Reset States
            userResponses = {};
            questions.forEach((_, idx) => {
                userResponses[idx] = { selected: null, status: 'notvisited' };
            });

            currentIndex = 0;
            userResponses[0].status = 'visited';

            setupSubjectTabs();
            renderPalette();
            renderQuestion();
            startTimer();
        }

        function setupSubjectTabs() {
            const container = document.getElementById('subject-tabs-container');
            container.innerHTML = '';
            const subjects = [...new Set(questions.map(q => q.subject))];

            subjects.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = "px-2.5 py-0.5 rounded text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium whitespace-nowrap";
                btn.textContent = sub;
                btn.onclick = () => {
                    const firstIdx = questions.findIndex(q => q.subject === sub);
                    if (firstIdx !== -1) jumpToQuestion(firstIdx);
                };
                container.appendChild(btn);
            });
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            if (!q) return;

            document.getElementById('current-q-label').textContent = `प्रश्न क्र. ${currentIndex + 1} (${q.subject})`;
            document.getElementById('question-text').textContent = q.question;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            const currentAnswer = userResponses[currentIndex].selected;

            q.options.forEach((optText, optIdx) => {
                const label = document.createElement('label');
                label.className = `flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition ${currentAnswer === optIdx ? 'bg-indigo-50 border-indigo-500 font-semibold text-indigo-900' : 'bg-white border-gray-200 hover:bg-gray-50'}`;
                
                label.innerHTML = `
                    <input type="radio" name="opt" value="${optIdx}" ${currentAnswer === optIdx ? 'checked' : ''} onchange="selectOption(${optIdx})" class="text-indigo-600 focus:ring-indigo-500">
                    <span class="text-xs sm:text-sm text-gray-800">${optText}</span>
                `;
                optContainer.appendChild(label);
            });

            updatePaletteCounts();
        }

        function selectOption(idx) {
            userResponses[currentIndex].selected = idx;
        }

        function saveAndNext() {
            if (userResponses[currentIndex].selected !== null) {
                userResponses[currentIndex].status = 'answered';
            } else if (userResponses[currentIndex].status !== 'review') {
                userResponses[currentIndex].status = 'unanswered';
            }
            nextQuestion();
        }

        function markForReview() {
            userResponses[currentIndex].status = 'review';
            nextQuestion();
        }

        function clearResponse() {
            userResponses[currentIndex].selected = null;
            userResponses[currentIndex].status = 'unanswered';
            renderQuestion();
            renderPalette();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                if (userResponses[currentIndex].status === 'notvisited') {
                    userResponses[currentIndex].status = 'unanswered';
                }
                renderQuestion();
                renderPalette();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                renderPalette();
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            if (userResponses[currentIndex].status === 'notvisited') {
                userResponses[currentIndex].status = 'unanswered';
            }
            renderQuestion();
            renderPalette();
        }

        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            questions.forEach((_, idx) => {
                const state = userResponses[idx].status;
                const isCurrent = idx === currentIndex;
                const btn = document.createElement('button');
                btn.textContent = idx + 1;
                btn.className = `w-8 h-8 rounded text-xs font-bold transition flex items-center justify-center ${isCurrent ? 'ring-2 ring-indigo-500 ring-offset-1' : ''}`;

                if (state === 'answered') {
                    btn.classList.add('bg-green-600', 'text-white');
                } else if (state === 'review') {
                    btn.classList.add('bg-purple-600', 'text-white');
                } else if (state === 'unanswered') {
                    btn.classList.add('bg-red-500', 'text-white');
                } else {
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                }

                btn.onclick = () => jumpToQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function updatePaletteCounts() {
            let ans = 0, unans = 0, rev = 0, notvisit = 0;
            Object.values(userResponses).forEach(r => {
                if (r.status === 'answered') ans++;
                else if (r.status === 'review') rev++;
                else if (r.status === 'unanswered') unans++;
                else notvisit++;
            });

            document.getElementById('count-ans').textContent = ans;
            document.getElementById('count-unans').textContent = unans;
            document.getElementById('count-review').textContent = rev;
            document.getElementById('count-notvisit').textContent = notvisit;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                    return;
                }
                timerSeconds--;
                const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const s = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${m}:${s}`;
            }, 1000);
        }

        function submitTest() {
            clearInterval(timerInterval);
            let correct = 0, wrong = 0;

            questions.forEach((q, idx) => {
                const userAns = userResponses[idx].selected;
                if (userAns !== null) {
                    if (userAns === q.answer) correct++;
                    else wrong++;
                }
            });

            const score = (correct * 2) - (wrong * 0.5);
            document.getElementById('res-total').textContent = questions.length;
            document.getElementById('res-correct').textContent = correct;
            document.getElementById('res-wrong').textContent = wrong;
            document.getElementById('res-score').textContent = `गुण: ${score.toFixed(2)} / ${questions.length * 2}`;

            document.getElementById('result-modal').classList.remove('hidden');
        }

        // Initialize on load
        window.onload = fetchAvailableQuizzes;
    </script>
</body>
          </html>
